[package]
name = "dl-driver-frameworks"
version.workspace = true
edition.workspace = true
description = "Framework integrations for dl-driver (PyTorch, TensorFlow)"
license = "MIT"

[dependencies]
tracing = "0.1"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
s3dlio = { git = "https://github.com/russfellows/s3dlio.git", tag = "v0.9.12" }

dl-driver-core = { path = "../core" }
dl-driver-formats = { path = "../formats" }

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
serde_json = "1.0"
numpy = "0.25"
pyo3 = { version = "0.25", features = ["extension-module"] }

# Framework-specific dependencies (feature-gated)
# Note: Using tch (libtorch bindings) instead of torch for PyTorch integration
[dependencies.tch]
version = "0.13"
optional = true

[features]
default = []
pytorch = ["tch"]
tensorflow = []
