[package]
name    = "dl-driver"          # ← the binary you will run
version.workspace = true
edition.workspace = true

[dependencies]
anyhow      = "1.0"
clap        = { version = "4.5", features = ["derive"] }
serde_yaml  = "0.9"
serde_json  = "1.0"
glob        = "0.3"
tokio       = { version = "1.0", features = ["full"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-log = "0.2"  # Bridge to capture log crate messages (used by s3dlio)
futures-util = "0.3"
dotenvy     = "0.15"
indicatif = "0.17"
dl-driver-core          = { path = "../core", version = "0.7.0" }
dl-driver-formats = { path = "../formats", version = "0.7.0" }
dl-driver-storage = { path = "../storage", version = "0.7.0" }
s3dlio = { git = "https://github.com/russfellows/s3dlio.git", rev = "0a578c3" }

[dev-dependencies]
tempfile = "3.0"
tokio-test = "0.4"
futures = "0.3"
rand = { version = "0.9", features = ["std", "alloc"] }
futures-util = "0.3"
serde_json = "1.0"
async-trait = "0.1"
tracing-test = "0.2"
walkdir = "2.0"

