[package]
name = "dl-driver-formats"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.98"
ndarray = "0.17"
# ndarray-npy removed - using s3dlio's custom NPY implementation for better performance
zip = { version = "2.1", default-features = false, features = ["deflate"] }
hdf5-metno = "0.10"
futures = "0.3"
futures-core = "0.3"
bytes = "1.0"
tempfile = "3.0"
crc32fast = "1.3"
crc32c = "0.6"
# Using s3dlio v0.9.17 with custom NPY implementation
s3dlio = { git = "https://github.com/russfellows/s3dlio.git", tag = "v0.9.17" }

[dev-dependencies]
tempfile = "3.20.0"



