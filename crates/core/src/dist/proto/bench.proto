syntax = "proto3";

package dl_driver.dist;

// Per-agent configuration overrides (v0.8.1)
message AgentConfig {
  // Agent identifier
  string agent_id = 1;
  
  // Override data_folder for this agent (multi-cloud/multi-region testing)
  string target_override = 2;
  
  // Path prefix for local storage isolation (e.g., "agent-{id}/")
  string path_prefix = 3;
  
  // Environment variable overrides (e.g., AWS_REGION, AZURE_STORAGE_ACCOUNT)
  map<string, string> env_vars = 4;
}

// Request to run a DLIO workload on an agent
message RunWorkloadRequest {
  // YAML configuration content for DLIO workload
  string config_yaml = 1;
  
  // Agent identifier (e.g., "host1:50051" or "agent-0")
  string agent_id = 2;
  
  // Path prefix for local storage isolation (e.g., "agent-{id}/")
  string path_prefix = 3;
  
  // Unix timestamp (milliseconds) when all agents should start
  // Enables coordinated execution across multiple hosts
  int64 start_unix_ms = 4;
  
  // Per-agent configuration overrides (v0.8.1)
  AgentConfig agent_config = 5;
  
  // Flag indicating if storage is shared across agents (S3/GCS/Azure)
  bool shared_storage = 6;
}

// Summary metrics returned after workload completion
message WorkloadSummary {
  // Agent identifier
  string agent_id = 1;
  
  // === STORAGE METRICS ===
  // Throughput metrics
  double ops_per_s = 2;        // Files/objects per second (IOPS)
  double mib_per_s = 3;        // Raw bandwidth (MiB/s)
  
  // Latency percentiles (milliseconds)
  double p50_ms = 4;
  double p90_ms = 5;
  double p95_ms = 6;
  double p99_ms = 7;
  
  // Error tracking and totals
  uint32 errors = 8;
  uint64 total_ops = 9;        // Total files/objects processed
  double duration_s = 10;
  
  // === AI/ML TRAINING METRICS ===
  // Sample-level metrics
  double samples_per_second = 11;  // Core training throughput metric
  uint64 total_samples = 12;       // Total samples processed
  uint64 samples_per_batch = 13;   // Batch size used
  
  // Batch-level metrics  
  double batches_per_second = 14;  // Training iteration rate
  uint64 total_batches = 15;       // Total batches completed
  double avg_batch_time_ms = 16;   // Average batch processing time
  
  // Epoch-level metrics (optional)
  uint32 epochs_completed = 17;    // Number of epochs run
  double avg_epoch_time_s = 18;    // Average time per epoch
  
  // Pipeline breakdown (optional)
  double data_loading_time_s = 19; // Time spent in data loading
  double compute_time_s = 20;      // Time spent in compute (if simulated)
  double pipeline_efficiency = 21; // Efficiency ratio (0-1)
  
  // === INLINE RESULTS COLLECTION (v0.8.1) ===
  // Inline transfer of results files (avoids separate file collection)
  string console_log = 22;          // Agent console output
  string metadata_json = 23;        // Agent metadata JSON
  string storage_tsv_content = 24;  // Storage metrics TSV
  string aiml_tsv_content = 25;     // AI/ML metrics TSV
  string results_path = 26;         // Local path where agent saved results
  
  // === HDR HISTOGRAM DATA (v0.8.6) ===
  // Serialized HDR histograms for accurate aggregation across agents
  // Using HDR histogram allows mathematically correct percentile merging
  // Each histogram type contains ALL size buckets serialized sequentially
  // (9 buckets for read/write: 0-4KiB, 4-32KiB, 32-128KiB, 128-512KiB, 
  //  512KiB-4MiB, 4-32MiB, 32-256MiB, 256MiB-1GiB, 1GiB+)
  bytes histogram_read = 27;    // Read operation latencies (all size buckets)
  bytes histogram_write = 28;   // Write operation latencies (all size buckets)
  bytes histogram_batch = 29;   // Batch processing times (single histogram)
}

// Health check response
message HealthCheckResponse {
  string status = 1;  // "healthy" or error message
  string version = 2;  // dl-driver version
}

// Empty request for health check
message HealthCheckRequest {}

// Distributed agent service
service DistAgent {
  // Execute a DLIO workload and return metrics
  rpc RunWorkload(RunWorkloadRequest) returns (WorkloadSummary);
  
  // Health check to verify agent is responsive
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}
