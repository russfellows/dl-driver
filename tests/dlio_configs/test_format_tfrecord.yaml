# Test Configuration: TFRecord Format
# TFRecord is TensorFlow's native format for efficient data pipelines

model:
  name: "bert"

framework: "tensorflow"

workflow:
  generate_data: false
  train: true
  checkpoint: false
  evaluation: false

dataset:
  data_folder: "file:///tmp/test_tfrecord_data"
  format: "tfrecord"
  num_files_train: 50
  record_length_bytes: 2048  # 2 KB per text sequence
  num_samples_per_file: 1000

reader:
  data_loader: "tensorflow"
  batch_size: 32
  prefetch: 8
  shuffle: true
  read_threads: 8
  compute_threads: 4
  seed: 42

train:
  epochs: 3
  computation_time: 0.05  # 50ms per batch
