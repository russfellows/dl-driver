# dl-driver ResNet50 Config - Single Host
#
# Based on DLIO ResNet50 benchmark with scaled parameters
# Matches sai3-bench resnet50_dlio_style.yaml capacity
#
# Single-host: 102,400 files, ~101 GB
# File sizes: Lognormal mean=1MB, std=512KB (similar to sai3-bench)

model:
  name: resnet50_workload
  model_size: 25583592

framework: pytorch

workflow:
  generate_data: true
  train: true
  checkpoint: true
  evaluation: false

dataset:
  data_folder: file:///mnt/lustre/resnet50/data
  format: npz
  
  # Match sai3-bench: 102,400 files
  num_files_train: 102400
  num_samples_per_file: 1  # One sample per file (not packed like DLIO original)
  
  # Mean file size: ~1 MB (matches sai3-bench lognormal mean)
  # DLIO original: 114,660 bytes per sample
  # This config: ~1 MB per file for realistic storage testing
  record_length_bytes: 1048576  # 1 MB

reader:
  data_loader: pytorch
  batch_size: 64
  prefetch: 32
  shuffle: true
  read_threads: 16
  compute_threads: 8
  transfer_size: 1048576  # 1 MB transfer size
  file_access_type: default

train:
  epochs: 5
  computation_time: 0.195  # 195ms per batch (DLIO original)
  seed: 42

checkpoint:
  checkpoint_folder: file:///mnt/lustre/resnet50/checkpoints
  checkpoint_after_epoch: 1
  epochs_between_checkpoints: 1
  steps_between_checkpoints: 500

profiling:
  profiler: pytorch_profiler
  profile_folder: /tmp/resnet50_profiles
  iostat: false

# Expected Results:
# - Files: 102,400
# - Total data: ~101 GB
# - Avg file size: ~1 MB
# - Comparable to sai3-bench resnet50_dlio_style.yaml
