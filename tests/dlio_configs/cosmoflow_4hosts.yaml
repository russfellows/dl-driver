# dl-driver CosmoFlow Config - 4 Hosts Distributed
#
# 4-host distributed: 320,000 files total (80,000 per host), ~732 GB total
# File sizes: Lognormal mean=2.5MB, std=1.25MB
#
# Usage:
#   Host 1-4: dl_driver_agent --agent-id agent-N --listen 0.0.0.0:50051
#
#   Controller: dl-driver distributed run \
#     --config cosmoflow_4hosts.yaml \
#     --agents http://host1:50051,...,http://host4:50051 \
#     --path-template "{id}/"

model:
  name: cosmoflow_4host_distributed
  model_size: 402568796

framework: tensorflow

workflow:
  generate_data: true
  train: true
  checkpoint: true
  evaluation: false

dataset:
  data_folder: file:///mnt/lustre/cosmoflow/data
  format: hdf5
  
  # 80,000 files per host × 4 = 320,000 total
  num_files_train: 80000
  num_samples_per_file: 1
  record_length_bytes: 2621440  # 2.5 MB

reader:
  data_loader: tensorflow
  batch_size: 8
  prefetch: 2
  shuffle: false
  read_threads: 16
  compute_threads: 8
  transfer_size: 2621440
  file_access_type: default

train:
  epochs: 5
  computation_time: 0.00936
  seed: 42

checkpoint:
  checkpoint_folder: file:///mnt/lustre/cosmoflow/checkpoints
  checkpoint_after_epoch: 1
  epochs_between_checkpoints: 1
  steps_between_checkpoints: 500

# Expected Results (4 hosts):
# - Files: 320,000 total (80,000 per host)
# - Total data: ~732 GB (~183 GB per host)
# - Avg file size: ~2.5 MB
