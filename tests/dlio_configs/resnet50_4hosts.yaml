# dl-driver ResNet50 Config - 4 Hosts Distributed
#
# Based on DLIO ResNet50 benchmark with scaled parameters
# Matches sai3-bench resnet50_dlio_style.yaml capacity
#
# 4-host distributed: 409,600 files total (~102K per host), ~404 GB total
# File sizes: Lognormal mean=1MB, std=512KB
#
# Usage:
#   Host 1: dl_driver_agent --agent-id agent-0 --listen 0.0.0.0:50051
#   Host 2: dl_driver_agent --agent-id agent-1 --listen 0.0.0.0:50051
#   Host 3: dl_driver_agent --agent-id agent-2 --listen 0.0.0.0:50051
#   Host 4: dl_driver_agent --agent-id agent-3 --listen 0.0.0.0:50051
#
#   Controller: dl-driver distributed run \
#     --config resnet50_4hosts.yaml \
#     --agents http://host1:50051,http://host2:50051,http://host3:50051,http://host4:50051 \
#     --path-template "{id}/"

model:
  name: resnet50_4host_distributed
  model_size: 25583592

framework: pytorch

workflow:
  generate_data: true
  train: true
  checkpoint: true
  evaluation: false

dataset:
  # Local storage - each agent uses separate subdirectory
  # With --path-template "{id}/", becomes:
  #   /mnt/lustre/resnet50/data/agent-0/
  #   /mnt/lustre/resnet50/data/agent-1/
  #   /mnt/lustre/resnet50/data/agent-2/
  #   /mnt/lustre/resnet50/data/agent-3/
  data_folder: file:///mnt/lustre/resnet50/data
  format: npz
  
  # 102,400 files per host × 4 = 409,600 total
  num_files_train: 102400
  num_samples_per_file: 1
  record_length_bytes: 1048576  # 1 MB

reader:
  data_loader: pytorch
  batch_size: 64
  prefetch: 32
  shuffle: true
  read_threads: 16
  compute_threads: 8
  transfer_size: 1048576
  file_access_type: default

train:
  epochs: 5
  computation_time: 0.195
  seed: 42

checkpoint:
  checkpoint_folder: file:///mnt/lustre/resnet50/checkpoints
  checkpoint_after_epoch: 1
  epochs_between_checkpoints: 1
  steps_between_checkpoints: 500

profiling:
  profiler: pytorch_profiler
  profile_folder: /tmp/resnet50_profiles
  iostat: false

# Expected Results (4 hosts):
# - Files: 409,600 total (102,400 per host)
# - Total data: ~404 GB (~101 GB per host)
# - Avg file size: ~1 MB
# - Comparable to sai3-bench resnet50_dlio_style.yaml × 4
