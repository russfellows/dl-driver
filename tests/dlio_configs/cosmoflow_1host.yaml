# dl-driver CosmoFlow Config - Single Host
#
# Based on DLIO CosmoFlow benchmark with scaled parameters
# Matches sai3-bench cosmoflow_dlio_style.yaml capacity
#
# Single-host: 80,000 files, ~183 GB
# File sizes: Lognormal mean=2.5MB, std=1.25MB

model:
  name: cosmoflow_workload
  model_size: 402568796

framework: tensorflow

workflow:
  generate_data: true
  train: true
  checkpoint: true
  evaluation: false

dataset:
  data_folder: file:///mnt/lustre/cosmoflow/data
  format: hdf5
  
  # Match sai3-bench: 80,000 files
  num_files_train: 80000
  num_samples_per_file: 1  # One 3D cosmology volume per file
  
  # Mean file size: ~2.5 MB (matches sai3-bench lognormal mean)
  # DLIO original: 2,828,486 bytes (~2.7 MB) per sample
  # This config: ~2.5 MB, very close to DLIO original
  record_length_bytes: 2621440  # 2.5 MB

reader:
  data_loader: tensorflow
  batch_size: 8
  prefetch: 2
  shuffle: false
  read_threads: 16
  compute_threads: 8
  transfer_size: 2621440  # 2.5 MB transfer size
  file_access_type: default

train:
  epochs: 5
  computation_time: 0.00936  # 9.36ms per batch (DLIO original)
  seed: 42

checkpoint:
  checkpoint_folder: file:///mnt/lustre/cosmoflow/checkpoints
  checkpoint_after_epoch: 1
  epochs_between_checkpoints: 1
  steps_between_checkpoints: 500

profiling:
  profiler: hdf5_profiler
  profile_folder: /tmp/cosmoflow_profiles
  iostat: false

# Expected Results:
# - Files: 80,000
# - Total data: ~183 GB
# - Avg file size: ~2.5 MB
# - Comparable to sai3-bench cosmoflow_dlio_style.yaml
