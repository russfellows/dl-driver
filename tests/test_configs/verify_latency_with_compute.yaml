# Phase 2 Latency Verification - Phase C: With Compute
# Purpose: Ensure compute time NOT included in I/O latency
# Expected: I/O latency same as Phase B (<1ms), but batch_time = ~195ms
# Dataset: 2,000 files × 20MB = 40GB, train for 5 epochs

model:
  name: verify_latency_test

framework: pytorch

workflow:
  generate_data: false
  train: true
  checkpoint: false

dataset:
  data_folder: "direct:///mnt/test/dl-driver-verify/"
  format: npz
  num_files_train: 64          # Just 64 files for quick verification test
  num_samples_per_file: 10     # 10 samples per file
  record_length_bytes: 2097152 # 2 MB per sample (10 samples × 2MB = 20MB per file)
  record_length_stdev: 0
  record_length_resize: 0

reader:
  read_threads: 8         # Fewer threads for quick test
  batch_size: 16          # 16 files per batch = 4 batches total
  prefetch: 2             # Just 2 batches ahead
  transfer_size: 262144

train:
  epochs: 1               # Just 1 epoch for quick verification
  computation_time: 0.195 # DLIO ResNet50 compute time (195ms)
