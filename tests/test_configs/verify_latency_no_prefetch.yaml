# Phase 2 Latency Verification - Phase A: No Prefetch (Baseline)
# Purpose: Measure RAW disk I/O latency without prefetching
# Expected: 5-50ms per read operation (actual disk seek + read time)

model:
  name: verify_latency_test

framework: pytorch

workflow:
  generate_data: false
  train: true
  checkpoint: false

dataset:
  data_folder: "direct:///mnt/test/dl-driver-verify/"
  format: npz
  num_files_train: 2000        # 2,000 files = 40GB dataset
  num_samples_per_file: 10     # 10 samples per file  
  record_length_bytes: 2097152 # 2 MB per sample (10 samples × 2MB = 20MB per file)
  record_length_stdev: 0
  record_length_resize: 0

reader:
  read_threads: 32        # Use 32 concurrent reads for testing
  batch_size: 16          # 16 files per batch
  prefetch: 0             # NO PREFETCH - see raw disk latency
  transfer_size: 262144

train:
  epochs: 5               # 5 epochs = 5 iterations through all 10,000 files
  computation_time: 0.0   # No compute to isolate I/O measurement
